<body>
<nav>
  <a class="logo" href="../">Image<span>Craft</span></a>
  <span class="breadcrumb">› Image Resizer</span>
</nav>

<div class="container">
  <h1>Image Resizer — Free</h1>
  <p class="subtitle">Resize to exact pixels, percentage, or social media presets. Runs in your browser.</p>

  <div class="upload-zone" id="drop-zone">
    <div class="up-icon">↔️</div>
    <div class="up-title">Drop image here</div>
    <div class="up-sub">JPG, PNG, WebP — any size</div>
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">Choose Image</button>
  </div>
  <input type="file" id="file-input" accept="image/*">

  <div id="controls" style="display:none">
    <div class="card">
      <div class="card-title">Quick Presets</div>
      <div class="presets">
        <button class="preset-btn" onclick="setPreset(1080,1080)">Instagram Square 1080×1080</button>
        <button class="preset-btn" onclick="setPreset(1080,1350)">Instagram Portrait 1080×1350</button>
        <button class="preset-btn" onclick="setPreset(1280,720)">YouTube Thumbnail 1280×720</button>
        <button class="preset-btn" onclick="setPreset(1500,500)">Twitter Banner 1500×500</button>
        <button class="preset-btn" onclick="setPreset(1200,628)">Facebook OG 1200×628</button>
        <button class="preset-btn" onclick="setPreset(800,800)">WhatsApp DP 800×800</button>
        <button class="preset-btn" onclick="setPreset(512,512)">Icon 512×512</button>
        <button class="preset-btn" onclick="setPreset(1920,1080)">Full HD 1920×1080</button>
      </div>

      <div class="card-title" style="margin-top:4px">Custom Size</div>
      <div class="orig-info" id="orig-info">Original: — × —</div>
      <div class="dim-row">
        <label>Width</label>
        <input type="number" id="w-input" min="1" max="8000" oninput="onWChange()">
        <span>px</span>
      </div>
      <div class="dim-row">
        <label>Height</label>
        <input type="number" id="h-input" min="1" max="8000" oninput="onHChange()">
        <span>px</span>
      </div>
      <div class="lock-row">
        <input type="checkbox" id="lock-ratio" checked>
        <label for="lock-ratio">Lock aspect ratio</label>
      </div>
    </div>

    <div class="result-info" id="result-info">Output: — × — px</div>
    <img id="preview-img" class="preview-img" src="" alt="Preview">

    <div class="actions">
      <a id="dl-btn" class="btn-dl" download="imagecraft-resized.jpg">⬇ Download Resized</a>
      <button class="btn-clear" onclick="reset()">New image</button>
    </div>
  </div>
</div>

<footer>
  <a href="../">← All ImageCraft Tools</a> · <a href="https://nxtcraft.github.io/">NxtCraft</a>
</footer>

<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const controls = document.getElementById('controls');
const canvas = document.createElement('canvas');
let origW = 0, origH = 0, origFile, origImg = new Image();

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  origFile = file;
  const url = URL.createObjectURL(file);
  origImg.onload = () => {
    origW = origImg.naturalWidth; origH = origImg.naturalHeight;
    document.getElementById('orig-info').textContent = `Original: ${origW} × ${origH} px`;
    document.getElementById('w-input').value = origW;
    document.getElementById('h-input').value = origH;
    dropZone.style.display = 'none'; controls.style.display = '';
    render();
  };
  origImg.src = url;
}

function onWChange() {
  if (document.getElementById('lock-ratio').checked) {
    const w = parseInt(document.getElementById('w-input').value) || 1;
    document.getElementById('h-input').value = Math.round(w * origH / origW);
  }
  render();
}
function onHChange() {
  if (document.getElementById('lock-ratio').checked) {
    const h = parseInt(document.getElementById('h-input').value) || 1;
    document.getElementById('w-input').value = Math.round(h * origW / origH);
  }
  render();
}
function setPreset(w, h) {
  document.getElementById('lock-ratio').checked = false;
  document.getElementById('w-input').value = w;
  document.getElementById('h-input').value = h;
  render();
}

function render() {
  const w = Math.max(1, parseInt(document.getElementById('w-input').value) || origW);
  const h = Math.max(1, parseInt(document.getElementById('h-input').value) || origH);
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(origImg, 0, 0, w, h);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  document.getElementById('preview-img').src = dataUrl;
  document.getElementById('result-info').textContent = `Output: ${w} × ${h} px`;
  const dl = document.getElementById('dl-btn');
  dl.href = dataUrl;
  dl.download = (origFile?.name.replace(/\.[^.]+$/, '') || 'image') + `-${w}x${h}.jpg`;
}

function reset() {
  controls.style.display = 'none'; dropZone.style.display = ''; fileInput.value = '';
}
</script>
