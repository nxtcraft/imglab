<body>
<nav>
  <a class="logo" href="../">Image<span>Craft</span></a>
  <span class="breadcrumb">› Format Converter</span>

<div class="container">
  <h1>Image Format Converter — Free</h1>
  <p class="subtitle">Convert PNG ↔ JPG ↔ WebP ↔ BMP. Batch up to 20 images. Runs in your browser.</p>

  <div class="upload-zone" id="drop-zone">
    <div class="up-icon">🔄</div>
    <div class="up-title">Drop images here (up to 20)</div>
    <div class="up-sub">PNG, JPG, WebP, BMP, GIF</div>
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">Choose Images</button>
  </div>
  <input type="file" id="file-input" accept="image/*" multiple>

  <div id="controls" style="display:none">
    <div class="card">
      <div class="card-title">Convert To</div>
      <div class="fmt-row">
        <label>Output format:</label>
        <select class="fmt-select" id="out-fmt" onchange="reconvert()">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <div class="bg-row" id="bg-row">
        <label>Background color (for transparent → JPG):</label>
        <input type="color" id="bg-color" value="#ffffff" onchange="reconvert()">
      </div>
    </div>

    <div class="file-list" id="file-list"></div>

    <div class="actions">
      <button class="btn-dl-all" id="dl-all-btn" onclick="downloadAll()">⬇ Download All</button>
      <button class="btn-clear" onclick="reset()">Convert more</button>
    </div>
  </div>
</div>

</footer>

<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const controls = document.getElementById('controls');
const fileList = document.getElementById('file-list');
let convertedItems = [];

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag'); handleFiles([...e.dataTransfer.files]); });
fileInput.addEventListener('change', () => handleFiles([...fileInput.files]));

function handleFiles(files) {
  files = files.filter(f => f.type.startsWith('image/')).slice(0, 20);
  if (!files.length) return;
  dropZone.style.display = 'none'; controls.style.display = '';
  fileList.innerHTML = '';
  convertedItems = [];
  files.forEach((file, i) => processFile(file, i));
}

function processFile(file, idx) {
  const item = { file, dataUrl: '', ext: '' };
  convertedItems.push(item);
  const row = document.createElement('div');
  row.className = 'file-item';
  row.id = `row-${idx}`;
  row.innerHTML = `<img class="file-thumb" src="" alt=""><div class="file-info"><div class="file-name">${file.name}</div><div class="file-size">${fmtSize(file.size)}</div></div><span class="status-badge processing" id="badge-${idx}">Processing…</span><a class="dl-link" id="dl-${idx}" style="display:none">Download</a>`;
  fileList.appendChild(row);
  const img = new Image();
  img.onload = () => {
    row.querySelector('.file-thumb').src = img.src;
    convert(img, item, idx);
  };
  img.src = URL.createObjectURL(file);
  item._img = img;
}

function convert(img, item, idx) {
  const fmt = document.getElementById('out-fmt').value;
  const bg = document.getElementById('bg-color').value;
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  if (fmt === 'image/jpeg') { ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  ctx.drawImage(img, 0, 0);
  const ext = fmt === 'image/jpeg' ? 'jpg' : fmt === 'image/webp' ? 'webp' : 'png';
  item.dataUrl = canvas.toDataURL(fmt, 0.9);
  item.ext = ext;
  const badge = document.getElementById(`badge-${idx}`);
  const dlLink = document.getElementById(`dl-${idx}`);
  badge.textContent = '✓ Done';
  badge.className = 'status-badge done';
  dlLink.style.display = '';
  dlLink.href = item.dataUrl;
  dlLink.download = item.file.name.replace(/\.[^.]+$/, '') + '.' + ext;
}

function reconvert() {
  const fmt = document.getElementById('out-fmt').value;
  document.getElementById('bg-row').style.display = fmt === 'image/jpeg' ? '' : 'none';
  convertedItems.forEach((item, i) => { if (item._img) convert(item._img, item, i); });
}

function downloadAll() {
  convertedItems.forEach(item => {
    if (!item.dataUrl) return;
    const a = document.createElement('a');
    a.href = item.dataUrl;
    a.download = item.file.name.replace(/\.[^.]+$/, '') + '.' + item.ext;
    a.click();
  });
}

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(2) + ' MB';
}

function reset() {
  controls.style.display = 'none'; dropZone.style.display = ''; fileInput.value = ''; convertedItems = [];
}
</script>
